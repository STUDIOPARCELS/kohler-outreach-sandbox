<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Builds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    border-bottom: 1px solid #1e293b;
    padding-bottom: 20px;
  }
  header h1 { font-size: 26px; font-weight: 650; color: #f1f5f9; letter-spacing: -0.01em; }
  header .sub { margin-top: 6px; font-size: 13px; color: #94a3b8; }
  #printBtn {
    flex: none;
    background: none;
    border: 1px solid #334155;
    color: #cbd5e1;
    font: inherit;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  #printBtn:hover { border-color: #64748b; color: #f1f5f9; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
  }

  .card {
    background: #f8fafc;
    color: #0f172a;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .card:hover, .card:has(.title-btn:focus-visible) {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  }
  .title-btn {
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-weight: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .title-btn:focus-visible { outline: 2px solid #475569; outline-offset: 2px; border-radius: 2px; }

  .photo {
    height: 175px;
    background: #e2e8f0;
    position: relative;
    flex: none;
  }
  .photo.no-photo { height: 96px; }
  .photo.has-drawing { background: #fff; height: 195px; padding: 8px 10px; }
  .photo.has-drawing svg { width: 100%; height: 100%; display: block; }
  .modal .photo.has-drawing { height: 300px; padding: 12px 16px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
  .photo .ph-note {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 13px;
    padding: 12px;
    text-align: center;
  }

  .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { font-size: 16.5px; font-weight: 650; line-height: 1.3; }
  .purpose { font-size: 13.5px; color: #334155; }

  .metrics {
    display: flex;
    gap: 0;
    border-top: 1px solid #e2e8f0;
    border-bottom: 1px solid #e2e8f0;
    padding: 8px 0;
  }
  .metric { flex: 1; }
  .metric + .metric { border-left: 1px solid #e2e8f0; padding-left: 10px; }
  .metric .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; }
  .metric .v { font-size: 13px; font-weight: 650; margin-top: 2px; }

  .use { font-size: 13px; color: #334155; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .use b { font-weight: 650; white-space: nowrap; }
  .gate { font-size: 12px; color: #64748b; text-align: right; }
  .gate b { font-weight: 650; color: #475569; }
  .buildif { font-size: 13px; color: #334155; }
  .buildif .k { font-weight: 650; }
  .desc { font-size: 13px; color: #475569; }
  .principles { font-size: 12.5px; color: #475569; border-top: 1px solid #e2e8f0; padding-top: 9px; margin-top: auto; }
  .principles .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; display: block; margin-bottom: 2px; }
  .open-cue { font-size: 12px; color: #64748b; margin-top: 2px; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.78);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #f8fafc;
    color: #0f172a;
    border-radius: 10px;
    max-width: 760px;
    width: 100%;
    overflow: hidden;
    position: relative;
  }
  .modal .photo { height: 260px; }
  .modal .photo.no-photo { height: 96px; }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 0;
    background: rgba(15, 23, 42, 0.65);
    color: #f8fafc;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .modal-body { padding: 22px 26px 28px; }
  .modal-body h2 { font-size: 20px; font-weight: 650; margin-bottom: 6px; }
  .modal-body .purpose { font-size: 14px; margin-bottom: 14px; }

  .statline {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 28px;
    background: #eef2f7;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 18px;
    font-size: 13.5px;
  }
  .statline b { font-weight: 650; }
  .statline .k { color: #64748b; }

  .msec { margin-bottom: 16px; }
  .msec h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #64748b;
    margin-bottom: 6px;
  }
  .msec ul, .msec ol { padding-left: 20px; font-size: 13.5px; color: #1e293b; }
  .msec li { margin-bottom: 3px; }
  ul.checklist { list-style: none; padding-left: 2px; }
  ul.checklist li { position: relative; padding-left: 22px; margin-bottom: 5px; }
  ul.checklist li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 3px;
    width: 11px;
    height: 11px;
    border: 1.5px solid #94a3b8;
    border-radius: 2px;
  }
  .msec p { font-size: 13.5px; color: #1e293b; }
  .msec pre {
    background: #eef2f7;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #1e293b;
    overflow-x: auto;
  }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  @media (max-width: 640px) { .cols2 { grid-template-columns: 1fr; } }

  /* Print */
  #print-sheet { display: none; }
  @media print {
    body { background: #fff; color: #000; }
    .wrap, .modal-overlay { display: none; }
    #print-sheet { display: block; padding: 0; font-size: 12px; color: #000; }
    #print-sheet h1 { font-size: 18px; margin-bottom: 2px; }
    #print-sheet .psub { font-size: 11px; color: #444; margin-bottom: 14px; }
    .pproj { border: 1px solid #999; border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
    .pproj h2 { font-size: 14px; margin-bottom: 3px; break-after: avoid; }
    .pproj .pline { margin-bottom: 6px; }
    .pproj h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; margin: 7px 0 2px; color: #333; break-after: avoid; }
    .pproj ul, .pproj ol { padding-left: 18px; margin: 0; }
    .pproj li { margin-bottom: 1px; break-inside: avoid; }
    .pproj ul.checklist { list-style: none; padding-left: 2px; }
    .pproj ul.checklist li { position: relative; padding-left: 15px; }
    .pproj ul.checklist li::before { content: ""; position: absolute; left: 0; top: 2px; width: 8px; height: 8px; border: 1px solid #333; border-radius: 1px; }
    .pproj .psec { break-inside: avoid; }
    .pproj .pdraw svg { width: 4.6in; height: 2.875in; display: block; margin: 4px auto 2px; }
    .pproj pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9.5px; line-height: 1.4; border: 1px solid #ccc; border-radius: 4px; padding: 6px 8px; margin: 2px 0 0; white-space: pre-wrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Project Builds</h1>
      <div class="sub">Parts &bull; Materials &bull; Tools &bull; Time &bull; Principles &bull; Real-World Use</div>
    </div>
    <button id="printBtn" type="button">Print</button>
  </header>
  <div class="grid" id="grid"><noscript>This page renders its project cards with JavaScript. Enable JavaScript to view the six build specs.</noscript></div>
</div>

<div class="modal-overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="print-sheet"></div>

<script>
const PROJECTS = [

    "title": "Front Suspension Pickup-Point Survey with Plumb-Bob Floor Grid",

    "physicalBuild": "A 36 x 72 in painter's-tape grid at 6 in pitch laid on the garage floor under the front axle of a car leveled on four 3-ton jack stands with the front wheels removed. Three 8 oz plumb bobs hang from magnet hooks on one side's lower-control-arm (LCA) and ball-joint points at a time and drop to within 1/8 in of the grid. The two strut top-mount studs, which have no clear drop path, transfer down via a straightedge laid across each strut tower. Six caliper-measured MDF datum blocks (pairs of 2, 4, and 6 in) stack under a torpedo level to transfer Z heights.",
    "proofOutput": "A coordinate table of all 8 pickup points in mm: X and Y read to 1/16 in (1.6 mm) from the tape and converted once, LCA and ball-joint Z to 1 mm from the block stack, strut-top Z to 2 mm from the tower straightedge datum. Plus a 1:5 scale front-view sketch with the strut-axis perpendicular, the extended LCA line, the constructed instant center, the roll-center height in mm above ground, and the anti-dive percentage computed from the side-view LCA pivot-axis inclination, the measured wheelbase, and a CG height assumed at 20 in and stated on the sheet.",
    "cost": "$60-90",

      "Hang the three plumb bobs from magnet hooks on one side's LCA inner front bushing bolt, LCA inner rear bushing bolt, and ball-joint nut, let each settle to 1/8 in above the floor, and mark the tips on the tape; repeat on the other side.",

      "Tabulate all 8 points and remeasure any left-right pair that disagrees by more than 3 mm.",
      "Draw the front view at 1:5 scale: construct the perpendicular to the strut axis at the top mount, extend the LCA line to intersect it at the instant center, and project from the instant center through the tire contact patch (wheel centerline on the ground line, located from the measured track width) to get roll-center height.",

  {
    "title": "Caliper-Fit Wrench Tray for a 12-Piece 8-19 mm Combination Set",
    "shortTitle": "Wrench Tray",
    "purpose": "Hold a 12-piece 8-19 mm combination wrench set in individually fitted slots so a missing wrench is visible at a glance.",
    "physicalBuild": "A plywood tray roughly 525 x 285 x 33 mm: a 12.7 mm Baltic birch base carrying two edge rails and 13 dividers, each divider 260 x 20 x 12.7 mm, glued and brad-pinned on edge to form 12 slots. Each slot is cut to the caliper-measured open-end head width of its wrench plus 1.5 mm clearance, ordered 8 mm to 19 mm left to right. Final tray length falls out of the layout math because slot widths come from measurement, not a template.",
    "proofOutput": "Photo of the finished tray with all 12 wrenches (8-19 mm) seated in their slots, plus a 12-row table of nominal size, measured head width, and cut slot width, with worst slot deviation under 0.5 mm.",
    "cost": "$40-60",
    "estimatedHours": 4,
    "realWorldUse": "4/5 practical use — sits on the bench and gets used every job, but the slots fit exactly one wrench set; replace the set and you rebuild the tray.",
    "image": "assets/photos/tool-tray.jpg",
    "requiredParts": [
      "1x box 18-gauge x 25 mm brads, 1000 ct",
      "4x self-adhesive rubber feet, 19 mm dia"
    ],
    "requiredMaterials": [
      "1x sheet 12.7 mm (1/2 in) Baltic birch plywood, 610 x 1220 mm (24 x 48 in)",
      "1x bottle Titebond II wood glue, 8 oz",
      "2x sheets 120-grit sandpaper",
      "2x sheets 220-grit sandpaper",
      "1x pint Watco Danish oil, natural"
    ],
    "requiredTools": [
      "0-150 mm digital calipers",
      "Table saw",
      "18-gauge brad nailer",
      "Combination square",
      "300 mm steel rule",
      "Random-orbit sander",
      "Fine-point black permanent marker"
    ],
    "principles": [
      "Design from measurement",
      "Clearance fit sizing",
      "Tolerance stack-up control",
      "Single-datum layout",
      "Part-as-gauge fitting"
    ],
    "assemblySteps": [
      "Measure the widest point of each of the 12 wrenches (the open-end head) with calipers to 0.1 mm, add 1.5 mm clearance to each, and write the 12 slot widths in a table.",
      "Sum the 12 slot widths plus 13 divider thicknesses (12.7 mm each) to get the tray length (about 525 mm), then cut the base to that length by 285 mm wide on the table saw.",
      "Rip 20 mm tall strips from the plywood, then crosscut 13 dividers at 260 mm and 2 edge rails to the base length.",
      "From one datum end of the base, mark every divider position cumulatively with the steel rule and combination square — never divider-to-divider — using the slot-width table.",
      "Glue and pin the two edge rails and the datum-end divider with 25 mm brads, then set each remaining divider in sequence, using its wrench as the spacing gauge against the previous divider.",
      "Before the glue sets, drop every wrench into its slot and confirm it seats and lifts freely; nudge any tight divider and re-pin.",
      "Sand to 220 grit, break all top edges, apply Danish oil, stick on the 4 rubber feet, and mark each slot with its wrench size in permanent marker."

    "title": "Rigid vs Rubber-Isolated Phone Mount Drive Vibration Test",
    "shortTitle": "Phone Mount Isolation Test",
    "purpose": "Measure how much rubber grommet isolation cuts road vibration reaching a dash-mounted phone compared to an identical hard-bolted mount.",
    "physicalBuild": "A 6 x 2 x 1/4 in aluminum base plate screws to two existing trim-screw points on the lower dash and carries two identical 5 in brackets cut from 1-1/2 x 1/8 in aluminum angle, each holding a spring-clamp phone holder. One bracket bolts metal-to-metal with two #10-24 screws; the other sits on rubber grommets in 3/8 in holes with nylon spacers inside the grommet bores, so the screws clamp the spacers and the bracket floats on rubber. The isolated mount targets a 15-20 Hz natural frequency with a 350 g phone — verified by the bump test in the assembly sequence, not assumed — putting inputs above 28 Hz into the isolation region.",

      "Cut one 6 in base plate from the 1/4 x 2 in flat bar and two 5 in brackets from the 1-1/2 in angle; file all cut edges.",
      "Measure the lower-dash trim-screw spacing with calipers, drill two matching 3/16 in holes in the base plate, then drill and tap four #10-24 holes with the #25 bit — two per bracket position at 1 in spacing.",
      "Drill the bracket feet: two 13/64 in holes in the rigid bracket, two 3/8 in holes in the isolated bracket, both at the same 1 in spacing, plus one 17/64 in hole in each vertical leg for the phone clamp.",

    "title": "6-Ton Bottle Jack H-Frame Shop Press",
    "shortTitle": "Bottle Jack Press",
    "purpose": "Press bearings, bushings, and press-fit pins in and out with 12,000 lbf of controlled force instead of a hammer and drift.",
    "physicalBuild": "A 42 in tall, 24 in wide welded H-frame (40 in uprights standing on 2 in tube feet): two 2 x 2 x 1/4 in square-tube uprights on 20 in tube feet, their tops sandwiched between a pair of C4 x 5.4 channels that react the ram load. A matching channel bed rides on two 3/4 in grade-8 threaded-rod pins set in 13/16 in holes drilled on 2 in centers, giving 12 in of height adjustment. The 6-ton bottle jack sits on a plate platform hung from two return springs; pumping the ram against the fixed thrust pad drives the platform's 1 in press nose down onto work supported by 1/2 in arbor bars on the channel bed.",
    "proofOutput": "Photo sequence of a trailer-hub bearing race pressed out and the new race pressed in, plus a measurement table: race OD by outside micrometer and hub bore by telescoping gauge, both to 0.001 in, with the interference recorded (0.002-0.003 in is typical for this hub), race seating depth within 0.002 in of the shoulder by caliper depth rod, and dial-indicator mid-span deflection of the top channels at full load (calculated 0.007 in at 12,000 lbf).",

    "assemblySteps": [
      "Cut the steel: two 40 in uprights and two 20 in feet from the 2 x 2 x 1/4 in tube, four 24 in lengths of C4 x 5.4 channel, and the 1/2 in plates (6 x 7 in platform, 6 x 5 in thrust pad, two 2 x 8 in arbor bars).",
      "Clamp the uprights side by side and drill seven 13/16 in hole pairs through both walls on the drill press, centers 2 in apart starting 8 in from the bottom end, holding alignment across the pair within 1/32 in.",
      "Sandwich the upright tops between the two top channels with a 1-1/4 in gap between channel backs and 16-1/2 in clear between uprights; equalize the frame diagonals within 1/16 in and lay 1/4 in fillet welds, at least 6 in of total weld per corner.",
      "Weld each upright centered on its 20 in foot, checking plumb both ways, then weld the 6 x 5 in thrust pad across the underside of the top channels.",
      "Weld the 1 in round press nose to the center of the 6 x 7 in platform, drill 1/4 in spring-anchor holes in the platform corners and channel flanges, and hang the platform from the two return springs on the 1/4-20 bolts.",
      "Set the bottle jack on the platform with its ram against the thrust pad, slide the two 24 in grade-8 rods through a hole pair, double-nut each end over washers, and rest the bed channels and arbor bars on the rods.",
      "Load-test to relief: with safety glasses on and the 3/4 in plywood shield between you and the work, pump the jack against the hardwood block until the relief valve opens (nominally the rated 12,000 lbf; the actual relief setting is unmeasured), inspect every weld, and record top-channel mid-span deflection with the dial indicator (calculated 0.007 in).",
      "Run the proof job: press the old bearing race out of a spare trailer hub with the arbor bars supporting the hub face and a shop towel wrapped around the race to contain fragments if it shatters, then press the new race in to the shoulder, measuring interference with the micrometer and bore gauge and seating depth with the caliper depth rod."

  {
    "title": "Brake Rotor Temperature Study: Heat Buildup and Cooldown Under Repeated 40-0 mph Stops",
    "shortTitle": "Rotor Temp Study",
    "purpose": "Measure how much heat repeated 40-0 mph stops dump into a front brake rotor and how fast convective cooling pulls it back out.",
    "physicalBuild": "An instrumented front-left brake corner: a 1 in square flat-black high-temperature paint patch on the rotor hat as a fixed infrared target, plus three 1/4 in wide Tempilaq stripes (300 °F, 400 °F, 500 °F) painted on the rotor's outer edge to record peak temperature. A two-cone braking course in an empty lot and a ruled clipboard log sheet complete the rig. One wheel-off session installs everything; nothing permanent is added to the car.",
    "proofOutput": "Plot of rotor temperature vs stop number for 10 consecutive stops, a 15-minute cooldown curve of temperature vs time, and a photo of the three Tempilaq stripes whose melted and unmelted states bracket the peak rotor temperature.",
    "cost": "$90-120",
    "estimatedHours": 4,
    "realWorldUse": "3/5 practical use — it measures the real thermal margin of your brakes before a mountain descent or trailer tow, but it is a one-weekend test you will rarely repeat.",
    "image": "assets/photos/brake-rotor-temp.jpg",
    "requiredParts": [
      "3x 2 oz bottles Tempilaq temperature-indicating liquid: 300 °F, 400 °F, 500 °F",
      "1x 11 oz aerosol VHT FlameProof flat black header paint, rated to 1,300 °F"
    ],
    "requiredMaterials": [
      "1x 14 oz aerosol can brake parts cleaner",
      "1x roll 1 in blue painter's tape, 60 yd",
      "10x sheets 1/4 in grid graph paper",
      "1x roll shop towels, 55 count"
    ],
    "requiredTools": [
      "Infrared thermometer, adjustable emissivity, range to 1,022 °F",
      "2-ton floor jack",
      "2x 3-ton jack stands",
      "1/2 in drive breaker bar, 19 mm lug socket",
      "1/2 in drive torque wrench, 30-150 ft-lb",
      "Stopwatch",
      "2x orange traffic cones, 12 in tall",
      "1x letter-size aluminum clipboard"
    ],
    "principles": [
      "Kinetic energy to heat",
      "Convective cooling",
      "Thermal mass",
      "Emissivity in IR measurement"
    ],
    "assemblySteps": [
      "Chock the rear wheels, jack the front-left corner onto a jack stand, remove the wheel with the breaker bar, and clean the outboard rotor face and hat with brake cleaner.",
      "Mask a 1 in square on the rotor hat with painter's tape, spray it with flat black header paint, then brush three 1/4 in wide Tempilaq stripes (300 °F, 400 °F, 500 °F) on the rotor's outer edge, 1 in apart; let everything dry 30 minutes.",
      "Reinstall the wheel, torque the lug nuts to the vehicle's spec (80 ft-lb on this car), and confirm the IR thermometer has a clear sight line to the black hat patch through the wheel spokes.",
      "Set the IR thermometer emissivity to 0.95 and check it against boiling water: it must read 212 °F within 5 °F.",
      "Set the two cones 110 ft apart in the empty lot to mark brake application and expected stopping point, and rule the log sheet with columns for stop number, clock time, and temperature.",
      "Run 10 consecutive 40-0 mph stops at a firm, repeatable pedal effort (about 0.5 g, stopping in roughly 110 ft) on a fixed 60 s cycle, taking an IR reading of the hat patch within 10 s of each stop from 12 in away; a second person takes the readings (running solo, start each 60 s cycle at the reading instead).",
      "After stop 10, park the car and log the rotor temperature every 60 s for 15 minutes to capture the cooldown curve.",
      "Pull the wheel, photograph the Tempilaq stripes to read peak temperature, then plot temperature vs stop number and cooldown temperature vs time on the graph paper."
    ],
    "criticalMeasurements": [
      "Entry speed 40 mph indicated, held within 2 mph at brake application on every stop",
      "IR reading taken within 10 s of full stop, from 12 in away, aimed only at the flat-black hat patch with emissivity set to 0.95",
      "Tempilaq stripes 1/4 in wide on the rotor's outer edge only, never on the pad-swept face",
      "Fixed 60 s cycle time between stops; cooldown logged every 60 s for 15 min after the final stop",
      "Expected rise roughly 40 °F per stop: 232 kJ of kinetic energy at 40 mph for a 3,200 lb car, 70% taken by the front axle, about 81 kJ into each 8 kg rotor",
      "Lug nuts torqued to the vehicle's spec (80 ft-lb on this car) after stripe application and rechecked after the test"

  {
    "title": "OBD-II Drive Logger: 5 Hz ECU Data Capture with In-Car Laptop Deck",
    "shortTitle": "OBD-II Drive Logger",
    "purpose": "Log RPM, vehicle speed, coolant temperature, and throttle position from the ECU at 5 Hz over a fixed commute loop, then extract per-gear drive ratios and the thermostat opening temperature from the CSV.",

    "assemblySteps": [
      "Cut the plywood deck to 16 x 14 in, round the corners to 1 in radius with the jigsaw, and sand all edges with 120 grit.",

    "criticalMeasurements": [

    "script": "import csv, time, obd\n\nconn = obd.OBD(\"/dev/ttyUSB0\", baudrate=115200)  # auto-negotiates the CAN protocol\ncmds = [obd.commands.RPM, obd.commands.SPEED,\n        obd.commands.COOLANT_TEMP, obd.commands.THROTTLE_POS]\n\nwith open(\"drive.csv\", \"w\", newline=\"\") as f:\n    w = csv.writer(f)\n    w.writerow([\"t_s\", \"rpm\", \"speed_kph\", \"ect_c\", \"throttle_pct\"])\n    t0 = time.time()\n    while True:\n        vals = []\n        for c in cmds:\n            r = conn.query(c)  # a dropped response logs a blank cell, not a crash\n            vals.append(r.value.magnitude if not r.is_null() else \"\")\n        w.writerow([round(time.time() - t0, 2)] + vals)\n        f.flush()\n        time.sleep(max(0, 0.2 - ((time.time() - t0) % 0.2)))",

 y2=\"140\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <circle cx=\"117\" cy=\"137\" r=\"2.5\" fill=\"#94a3b8\"/>\n\n  <text x=\"612\" y=\"262\" font-size=\"13\" fill=\"#475569\">Laptop strapped with</text>\n  <text x=\"612\" y=\"278\" font-size=\"13\" fill=\"#475569\">2x hook-and-loop straps</text>\n  <line x1=\"608\" y1=\"258\" x2=\"504\" y2=\"224\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <circle cx=\"502\" cy=\"223\" r=\"2.5\" fill=\"#94a3b8\"/>\n\n  <text x=\"612\" y=\"318\" font-size=\"13\" fill=\"#475569\">1/2 in plywood deck,</text>\n  <text x=\"612\" y=\"334\" font-size=\"13\" fill=\"#475569\">non-slip rubber liner</text>\n  <line x1=\"608\" y1=\"320\" x2=\"536\" y2=\"300\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <circle cx=\"534\" cy=\"299\" r=\"2.5\" fill=\"#94a3b8\"/>\n\n  <text x=\"400\" y=\"468\" font-size=\"13\" fill=\"#475569\" text-anchor=\"middle\">Seatbelt threaded through slots</text>\n  <line x1=\"400\" y1=\"456\" x2=\"403\" y2=\"316\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n  <circle cx=\"403\" cy=\"313\" r=\"2.5\" fill=\"#94a3b8\"/>\n\n  <!-- ============ DETAIL A: BELT SLOT (magnified) ============ -->\n  <rect x=\"598\" y=\"40\" width=\"192\" height=\"178\" fill=\"none\" stroke=\"#cbd5e1\" stroke-width=\"1\"/>\n  <!-- deck fragment, rear edge at bottom -->\n  <rect x=\"610\" y=\"86\" width=\"145\" height=\"94\" fill=\"#e2e8f0\" stroke=\"none\"/>\n  <polyline points=\"610,180 610,86 755,86 755,180\" fill=\"none\" stroke=\"#cbd5e1\" stroke-width=\"1\"/>\n  <line x1=\"610\" y1=\"180\" x2=\"755\" y2=\"180\" stroke=\"#334155\" stroke-width=\"2\"/>\n  <!-- slot -->\n  <rect x=\"658\" y=\"96\" width=\"20\" height=\"72\" rx=\"10\" fill=\"#f1f5f9\" stroke=\"#334155\" stroke-width=\"2\"/>\n  <!-- slot centerline -->\n  <line x1=\"618\" y1=\"132\" x2=\"712\" y2=\"132\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"10 4 2 4\"/>\n  <!-- 5/8 in slot width -->\n  <line x1=\"658\" y1=\"92\" x2=\"658\" y2=\"66\" stroke=\"#64748b\" stroke-wid function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function photoHTML(p) {
  if (p.drawing) {
    return '<div class="photo has-drawing" role="img" aria-label="Dimensioned drawing: ' + esc(p.shortTitle) + '">' + p.drawing + '</div>';
  }
  return '<div class="photo"><div class="ph-note">[Real-world photo of built item]</div>' +
    '<img src="' + esc(p.image) + '" alt="' + esc(p.shortTitle) + '" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'no-photo\')"></div>';
}

function list(items, tag) {
  tag = tag || 'ul';
  return '<' + tag + '>' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</' + tag + '>';
}

function checklist(items) {
  return '<ul class="checklist">' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>';
}

function cardHTML(p, i) {
  return '<article class="card" data-i="' + i + '">' +
    photoHTML(p) +
    '<div class="card-body">' +
      '<h2><button class="title-btn" type="button">' + esc(p.shortTitle) + '</button></h2>' +
      '<p class="purpose">' + esc(p.purpose) + '</p>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="k">Parts</div><div class="v">' + p.requiredParts.length + '</div></div>' +
        '<div class="metric"><div class="k">Materials</div><div class="v">' + p.requiredMaterials.length + '</div></div>' +
        '<div class="metric"><div class="k">Tools</div><div class="v">' + p.requiredTools.length + '</div></div>' +
        '<div class="metric"><div class="k">Time</div><div class="v">' + p.estimatedHours + ' h</div></div>' +
        '<div class="metric"><div class="k">Cost</div><div class="v">' + esc(p.cost) + '</div></div>' +
      '</div>' +
      '<div class="use"><b>' + esc(p.realWorldUse.split(' — ')[0]) + '</b>' +
        '<span class="gate">Top tool: <b>' + esc(p.toolGate) + '</b></span></div>' +
      '<p class="desc">' + esc(p.oneLiner) + '</p>' +
      '<div class="buildif"><span class="k">Build it if</span> ' + esc(p.buildIf) + '</div>' +
      '<div class="principles"><span class="k">Principles</span>' + p.principles.map(esc).join(' &middot; ') + '</div>' +
      '<div class="open-cue">Full build plan &#9656;</div>' +
    '</div>' +
  '</article>';
}

function modalHTML(p) {
  return photoHTML(p) +
    '<div class="modal-body">' +
      '<h2 id="modalTitle">' + esc(p.title) + '</h2>' +
      '<p class="purpose">' + esc(p.purpose) + '</p>' +
      '<div class="statline">' +
        '<span><span class="k">Use:</span> <b>' + esc(p.realWorldUse.split(' — ')[0]) + '</b></span>' +
        '<span><span class="k">Time:</span> <b>' + p.estimatedHours + ' h</b></span>' +
        '<span><span class="k">Cost:</span> <b>' + esc(p.cost) + '</b></span>' +
        '<span><span class="k">Top tool:</span> <b>' + esc(p.toolGate) + '</b></span>' +
      '</div>' +
      '<div class="msec"><h3>Build Description</h3><p>' + esc(p.physicalBuild) + '</p></div>' +
      '<div class="cols2">' +
        '<div>' +
          '<div class="msec"><h3>Buy: Parts</h3>' + checklist(p.requiredParts) + '</div>' +
          '<div class="msec"><h3>Buy: Materials</h3>' + checklist(p.requiredMaterials) + '</div>' +
        '</div>' +
        '<div class="msec"><h3>Tools</h3>' + list(p.requiredTools) + '</div>' +
      '</div>' +
      '<div class="msec"><h3>Assembly Sequence</h3>' + list(p.assemblySteps, 'ol') + '</div>' +
      '<div class="msec"><h3>Critical Measurements</h3>' + list(p.criticalMeasurements) + '</div>' +
      (p.script ? '<div class="msec"><h3>Logging Script (log.py)</h3><pre>' + esc(p.script) + '</pre></div>' : '') +
      '<div class="msec"><h3>Engineering Principles</h3><p>' + p.principles.map(esc).join(', ') + '</p></div>' +
      '<div class="msec"><h3>Real-World Use</h3><p>' + esc(p.realWorldUse) + ' Build it if ' + esc(p.buildIf) + '</p></div>' +
      '<div class="msec"><h3>Proof / Deliverables</h3><p>' + esc(p.proofOutput) + '</p></div>' +
    '</div>';
}

function printProjHTML(p) {
  function psec(title, body) { return '<div class="psec"><h3>' + title + '</h3>' + body + '</div>'; }
  return '<div class="pproj">' +
    '<h2>' + esc(p.title) + '</h2>' +
    '<div class="pline">' + esc(p.purpose) + ' &mdash; ' + esc(p.realWorldUse) + ' &mdash; ' + p.estimatedHours + ' h &mdash; ' + esc(p.cost) + '</div>' +
    (p.drawing ? '<div class="psec pdraw">' + p.drawing + '</div>' : '') +
    psec('Build Description', '<div>' + esc(p.physicalBuild) + '</div>') +
    psec('Buy: Parts', checklist(p.requiredParts)) +
    psec('Buy: Materials', checklist(p.requiredMaterials)) +
    psec('Tools', list(p.requiredTools)) +
    psec('Assembly Sequence', list(p.assemblySteps, 'ol')) +
    psec('Critical Measurements', list(p.criticalMeasurements)) +
    (p.script ? psec('Logging Script (log.py)', '<pre>' + esc(p.script) + '</pre>') : '') +
    psec('Principles', '<div>' + p.principles.map(esc).join(', ') + '</div>') +
    psec('Proof / Deliverables', '<div>' + esc(p.proofOutput) + '</div>') +
  '</div>';
}

document.getElementById('grid').innerHTML = PROJECTS.map(cardHTML).join('');
document.getElementById('print-sheet').innerHTML =
  '<h1>Project Builds</h1><div class="psub">Parts &bull; Materials &bull; Tools &bull; Time &bull; Principles &bull; Real-World Use</div>' +
  PROJECTS.map(printProjHTML).join('');

const overlay = document.getElementById('overlay');
const modalContent = document.getElementById('modalContent');
let lastFocus = null;

function openModal(i) {
  modalContent.innerHTML = modalHTML(PROJECTS[i]);
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  lastFocus = document.activeElement;
  document.getElementById('modalClose').focus();
}
function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}

document.getElementById('grid').addEventListener('click', e => {
  if (String(window.getSelection())) return; // let users copy part specs off cards
  const card = e.target.closest('.card');
  if (card) openModal(+card.dataset.i);
});
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => {
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'Tab') {
    const focusables = overlay.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
    else if (!overlay.contains(document.activeElement)) { first.focus(); e.preventDefault(); }
  }
});
document.getElementById('printBtn').addEventListener('click', () => window.print());
</script>
